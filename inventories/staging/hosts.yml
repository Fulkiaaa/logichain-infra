---
# VM Multipass créée (tâche 2). IP attribuée par Multipass via DHCP :
# elle peut changer après un redémarrage de la VM (voir Runbook) ;
# la revérifier avec `multipass info logichain-staging` si la connectivité échoue.
logichain:
  hosts:
    logichain-staging:
      ansible_host: "192.168.252.2"
      ansible_user: ubuntu
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
