[defaults]
inventory            = inventories/staging
roles_path           = roles
host_key_checking    = False
stdout_callback      = default
interpreter_python   = auto_silent
vault_password_file  = .vault-pass
retry_files_enabled  = False

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root

[callback_default]
# Le callback community.general.yaml a été retiré de la collection en version 12.0.0 ;
# la sortie YAML lisible s'obtient désormais via cette option du callback par défaut.
result_format = yaml
