# Pipeline de déploiement continu.
#
# La cible réelle (VM Multipass locale) est injoignable depuis un runner
# GitHub : le runner EST donc la machine vierge. Chaque exécution fournit un
# Ubuntu 24.04 neuf sur lequel le playbook complet est joué en connexion
# locale (inventories/ci), rejoué pour vérifier l'idempotence, puis vérifié
# par des tests de fumée contre l'API réellement déployée.
---
name: cd
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  provision:
    name: Provisionnement et idempotence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Installer Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install -r requirements.yml

      - name: Écrire le mot de passe du vault
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault-pass
      - run: chmod 600 .vault-pass

      # Couche 1 (protection de fond) : enregistrer chaque secret du vault CI
      # auprès du runner via `::add-mask::`, AVANT de jouer le playbook. À
      # partir de là, GitHub remplace ces chaînes par *** dans TOUT le journal
      # du job, y compris dans une trace d'erreur qui les ferait fuiter sans
      # qu'on l'ait prévu (ex. MongoParseError qui embarque un fragment
      # d'URI). Seul ANSIBLE_VAULT_PASSWORD est un secret GitHub natif
      # (masqué automatiquement) ; vault_jwt_secret et vault_mongodb_*_password
      # sortent du vault au moment du playbook et ne le sont pas sans cette
      # étape. Le script ne doit JAMAIS afficher les valeurs autrement que
      # via `::add-mask::` (ni echo, ni set -x) : leur sortie est capturée en
      # mémoire par Python, jamais imprimée telle quelle.
      - name: Enregistrer les secrets du vault CI auprès du runner (masquage)
        run: |
          python3 - <<'PYEOF'
          import subprocess
          import yaml

          out = subprocess.run(
              ["ansible-vault", "view", "inventories/ci/group_vars/all/vault.yml"],
              capture_output=True, text=True, check=True,
          ).stdout
          data = yaml.safe_load(out)
          for key in ("vault_jwt_secret", "vault_mongodb_admin_password", "vault_mongodb_app_password"):
              print(f"::add-mask::{data[key]}")
          PYEOF

      # 1. Provisionnement complet sur un Ubuntu 24.04 neuf.
      - name: Provisionner
        run: ansible-playbook site.yml -i inventories/ci

      # Diagnostic pur (n'affecte jamais le statut du job) : aucune
      # information exploitable sur la cause d'un échec de provisionnement
      # n'apparaît dans la sortie d'ansible-playbook ci-dessus au-delà de
      # « changed »/« failed » — les vrais journaux (PM2, systemd, ports en
      # écoute) ne sont visibles qu'en interrogeant la cible elle-même.
      #
      # Couche 2 (défense en profondeur, en plus du masquage dynamique
      # ci-dessus) : toute sortie de diagnostic passe par un filtre qui
      # neutralise le segment identifiants d'une URI MongoDB
      # (mongodb://user:pass@ → mongodb://***:***@). `pm2 logs` est la seule
      # source ici susceptible de contenir un tel fragment (le gestionnaire
      # d'erreurs de l'API journalise l'objet d'erreur complet sur les 500
      # non gérées, et un MongoParseError peut embarquer l'URI). error.log et
      # out.log (déclarés dans ecosystem.config.js) ne sont volontairement
      # PAS dumpés ici : constaté aux runs précédents, PM2 ne les crée jamais
      # (« No such file or directory ») — `pm2 logs` couvre déjà le même
      # stdout/stderr applicatif, sans le double surface de fuite.
      - name: Diagnostiquer un échec de provisionnement
        if: failure()
        run: |
          mask_mongo_uri() {
            sed -E 's#(mongodb(\+srv)?://)[^:/@[:space:]]*:[^@[:space:]]*@#\1***:***@#g'
          }

          echo "--- pm2 status (utilisateur logichain) ---"
          sudo -u logichain -H bash -lc 'cd /opt/logichain && pm2 status' | mask_mongo_uri || true
          echo "--- pm2 logs (100 dernières lignes, identifiants Mongo masqués) ---"
          sudo -u logichain -H bash -lc 'cd /opt/logichain && pm2 logs --nostream --lines 100' 2>&1 | mask_mongo_uri || true
          echo "--- node résolu par l'utilisateur logichain ---"
          sudo -u logichain -H bash -lc 'which node; node -v; echo "PATH=$PATH"' || true
          echo "--- ports en écoute ---"
          sudo ss -tlnp || true
          echo "--- statut mongod ---"
          sudo systemctl status mongod --no-pager || true
          echo "--- .env applicatif (secrets masqués) ---"
          sudo sed -E 's/(JWT_SECRET|MONGO_URI)=.*/\1=***/' /opt/logichain/.env || true

      # 2. Second passage — la garantie d'idempotence.
      #
      # `set -o pipefail` (déjà actif par défaut dans les steps `run:` bash de
      # GitHub Actions, répété ici par clarté) fait échouer immédiatement
      # cette étape si ansible-playbook lui-même se termine en erreur — un
      # `failed=1` ne peut donc jamais se glisser derrière un `changed=0` et
      # passer inaperçu. La récupération du récapitulatif final (PLAY RECAP)
      # est ensuite analysée explicitement : l'absence de récap exploitable
      # (format inattendu, ligne manquante) fait échouer le contrôle plutôt
      # que de le laisser passer par défaut.
      - name: Vérifier l'idempotence
        run: |
          set -o pipefail
          ansible-playbook site.yml -i inventories/ci | tee run2.log

          recap=$(grep -E ': *ok=[0-9]+ *changed=[0-9]+' run2.log | tail -n1)
          echo "Récapitulatif du second passage : ${recap}"

          changed=$(echo "${recap}" | grep -oE 'changed=[0-9]+' | cut -d= -f2)
          failed=$(echo "${recap}" | grep -oE 'failed=[0-9]+' | cut -d= -f2)

          if [ -z "${changed}" ] || [ -z "${failed}" ]; then
            echo "::error::Impossible d'extraire le récapitulatif du second passage — contrôle d'idempotence en échec par défaut"
            exit 1
          fi

          if [ "${changed}" != "0" ] || [ "${failed}" != "0" ]; then
            echo "::error::Playbook non idempotent — changed=${changed} failed=${failed} au second passage"
            exit 1
          fi

      # 3. Tests de fumée contre l'API réellement déployée.
      - name: Tests de fumée — santé de l'API (direct)
        run: curl -fsS http://127.0.0.1:3000/health

      - name: Tests de fumée — santé de l'API (via le proxy Nginx, TLS)
        run: curl -fsS -o /dev/null -w '%{http_code}\n' -k https://localhost/health

      # Preuve que MongoDB est réellement interrogé (pas seulement que Node
      # tourne) : des identifiants inexistants doivent produire un 401 au
      # format d'erreur métier de l'API (voir src/core/errors/UnauthorizedError.ts
      # et src/middlewares/error-handler.middleware.ts côté logichain-api),
      # pas une erreur de connexion ni un 500.
      - name: Tests de fumée — authentification refusée (401, format métier)
        run: |
          http_code=$(curl -s -k -o /tmp/login-response.json -w '%{http_code}' \
            -X POST https://localhost/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"personne-inexistante@example.com","password":"mot-de-passe-inexistant-1!"}')

          echo "Code HTTP reçu : ${http_code}"
          cat /tmp/login-response.json

          if [ "${http_code}" != "401" ]; then
            echo "::error::Attendu HTTP 401, reçu ${http_code}"
            exit 1
          fi

          error_code=$(python3 -c "import json,sys; print(json.load(open('/tmp/login-response.json'))['error']['code'])")
          if [ "${error_code}" != "UNAUTHORIZED" ]; then
            echo "::error::Code d'erreur métier attendu UNAUTHORIZED, reçu ${error_code}"
            exit 1
          fi

      - name: Nettoyer le mot de passe du vault
        if: always()
        run: rm -f .vault-pass
